name: Check and publish Qoder CN

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package in Arch Linux
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          docker run --rm \
            -e QODER_DEB_URL \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm curl xz
              ./scripts/build-package.sh
            '

      - name: Read package metadata
        id: metadata
        run: |
          cat dist/version.env >> "$GITHUB_OUTPUT"
          {
            echo "tag=v$(sed -n 's/^PKGVER=//p' dist/version.env)"
            echo "notes<<EOF"
            echo "Qoder CN upstream version: $(sed -n 's/^UPSTREAM_VERSION=//p' dist/version.env)"
            echo
            echo "Source: $(sed -n 's/^SOURCE_URL=//p' dist/version.env)"
            echo "Source SHA256: $(sed -n 's/^SOURCE_SHA256=//p' dist/version.env)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.metadata.outputs.tag }}'
          package_path=(dist/*.pkg.tar.*)
          checksum_path=(dist/*.sha256)
          package_asset="$(basename "${package_path[0]}")"
          checksum_asset="$(basename "${checksum_path[0]}")"

          upload_with_retry() {
            local path="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$path" --clobber; then
                return 0
              fi
              echo "Upload attempt $attempt for $(basename "$path") failed; retrying."
              sleep 10
            done
            return 1
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if ! grep -Fxq "$package_asset" <<<"$assets"; then
              upload_with_retry "${package_path[0]}"
            fi
            if ! grep -Fxq "$checksum_asset" <<<"$assets"; then
              upload_with_retry "${checksum_path[0]}"
            fi
            echo "Release $tag already exists; verified its assets."
            exit 0
          fi
          gh release create "$tag" "${package_path[0]}" \
            --title "Qoder CN ${{ steps.metadata.outputs.UPSTREAM_VERSION }}" \
            --notes '${{ steps.metadata.outputs.notes }}'
          upload_with_retry "${checksum_path[0]}"
