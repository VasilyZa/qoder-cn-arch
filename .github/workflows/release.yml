name: Check and publish Qoder CN

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package in Arch Linux
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          docker run --rm \
            -e QODER_DEB_URL \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm curl xz
              ./scripts/build-package.sh
            '

      - name: Read package metadata
        id: metadata
        run: |
          cat dist/version.env >> "$GITHUB_OUTPUT"
          {
            echo "tag=v$(sed -n 's/^PKGVER=//p' dist/version.env)"
            echo "notes<<EOF"
            echo "Qoder CN upstream version: $(sed -n 's/^UPSTREAM_VERSION=//p' dist/version.env)"
            echo
            echo "Source: $(sed -n 's/^SOURCE_URL=//p' dist/version.env)"
            echo "Source SHA256: $(sed -n 's/^SOURCE_SHA256=//p' dist/version.env)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.metadata.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          gh release create "$tag" dist/*.pkg.tar.* dist/*.sha256 \
            --title "Qoder CN ${{ steps.metadata.outputs.UPSTREAM_VERSION }}" \
            --notes '${{ steps.metadata.outputs.notes }}'
